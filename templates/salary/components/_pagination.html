<div class="pagination">

    {% if page > 1 %}
        <a href="/salaries?page={{ page-1 }}&keyword={{ keyword }}&month={{ month }}&year={{ year }}">
            <- Trước
        </a>
    {% endif %}

    <span>
        Trang {{ page }} // {{ total_pages }}
    </span>

    {% if page < total_pages %}
        <a href="/salaries?page={{ page+1 }}&keyword={{ keyword }}&month={{ month }}&year={{ year }}">
            Sau ->
        </a>
    {% endif %}

</div>
