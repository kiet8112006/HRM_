<form method="GET" class="card search-form">

    <div class="search-group">
        <input
            class="form-control"
            type="text"
            name="keyword"
            placeholder="Tên nhân viên..."
            value="{{ keyword | e  }}"
        >
    </div>

    <select
        class="form-control filter-select"
        name="month">

        <option value="">
            Tất cả tháng
        </option>

        {% for m in range(1,13) %}
        <option
            value="{{ m }}"
            {% if month == m|string %}
            selected
            {% endif %}>
            Tháng {{ m }}
        </option>
        {% endfor %}

    </select>

    <select
        class="form-control filter-select"
        name="year">

        <option value="">
            Tất cả năm
        </option>

        <option value="2024" {% if year=="2024" %}selected{% endif %}>
            2024
        </option>

        <option value="2025" {% if year=="2025" %}selected{% endif %}>
            2025
        </option>

        <option value="2026" {% if year=="2026" %}selected{% endif %}>
            2026
        </option>

        <option value="2027" {% if year=="2027" %}selected{% endif %}>
            2027
        </option>

    </select>

    <button
        class="btn btn-primary"
        type="submit">
        Tìm Kiếm
    </button>

</form>
