<form method="POST" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-grid">

        <div class="form-group">
            <label class="form-label">Nhân Viên</label>

            <select class="form-control" name="employee_id" required>

                {% for emp in employees %}
                <option value="{{ emp.EmployeeID }}">
                    {{ emp.FullName }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Ngày</label>

            <input
                class="form-control"
                type="date"
                name="date"
                max="{{ today }}"
                required>
        </div>

        <div class="form-group">
            <label class="form-label">Check In</label>

            <input
                class="form-control"
                type="time"
                name="checkin"
                required>
        </div>

        <div class="form-group">
            <label class="form-label">Check Out</label>

            <input
                class="form-control"
                type="time"
                name="checkout"
                required>
        </div>

        <div class="form-group">
            <label class="form-label">Phương Thức Chấm Công</label>

            <select
                class="form-control"
                name="checkin_method">

                <option value="FaceID">FaceID</option>
                <option value="Fingerprint">Vân tay</option>
                <option value="QR Code">QR Code</option>
                <option value="GPS">GPS</option>
                <option value="Manual">Thủ công</option>

            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Trạng Thái</label>

            <select
                class="form-control"
                name="status"
                required>

                <option value="">
                    -- Chọn trạng thái --
                </option>

                <option value="Có mặt">Có mặt</option>
                <option value="Đi trễ">Đi trễ</option>
                <option value="Vắng">Vắng</option>

            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Trạng Thái Duyệt</label>

            <select
                class="form-control"
                name="approval_status">

                <option value="Chờ duyệt">Chờ duyệt</option>
                <option value="Đã duyệt">Đã duyệt</option>

            </select>
        </div>

        <div class="form-group" style="grid-column:1 / -1;">

            <label class="form-label">Ghi Chú</label>

            <textarea
                class="form-control"
                name="notes"
                rows="5"
                maxlength="255"
                placeholder="Nhập ghi chú nếu có"></textarea>

        </div>

    </div>

    <div class="form-actions">

        <button
            type="submit"
            class="btn btn-primary">

            ➕ Thêm Chấm Công

        </button>

        <a
            href="{{ url_for('attendance.attendance') }}"
            class="btn btn-secondary">

            ← Quay lại

        </a>

    </div>

</form>
