<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - HRM System</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS Chuyên Biệt Cho Trang Auth -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark_light_auth_mode.css') }}">
</head>
<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-header">

            <h1>HRM System</h1>

            <p>Quên mật khẩu</p>

        </div>

        {% include "components/_flash.html" %}
        <form
    method="POST"
    action="{{ url_for('auth.forgot_password')}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">

    <label>Tên đăng nhập</label>

    <input
        type="text"
        name="username"
        value="{{ request.form.get('username', '')}}"
        placeholder="Nhập tên đăng nhập">

</div>
<div class="form-group">

    <label>Mật khẩu mới</label>

    <input
        type="password"
        name="password"
        placeholder="Nhập mật khẩu mới">

</div>
<div class="form-group">

    <label>Xác nhận mật khẩu</label>

    <input
        type="password"
        name="confirm_password"
        placeholder="Nhập lại mật khẩu">

</div>
<button
    class="btn btn-primary login-btn"
    type="submit">

    Đổi mật khẩu

</button>
<div class="login-footer">

    <a href="{{ url_for('auth.login') }}">

        Quay lại đăng nhập

    </a>

</div></form>
    </div>

</div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>

</html>
