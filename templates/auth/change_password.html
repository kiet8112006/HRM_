<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - HRM System</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS Chuyên Biệt Cho Trang Auth -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark_light_auth_mode.css') }}">
</head>
<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-header">

            <h1>HRM System</h1>

            <p>Đổi mật khẩu</p>

        </div>

        {% include "components/_flash.html" %}

        <form
            method="POST"
            action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label>Mật khẩu hiện tại</label>

                <input
                    type="password"
                    name="old_password"
                    placeholder="Nhập mật khẩu hiện tại">

            </div>

            <div class="form-group">

                <label>Mật khẩu mới</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Nhập mật khẩu mới">

            </div>

            <div class="form-group">

                <label>Xác nhận mật khẩu</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Nhập lại mật khẩu mới">

            </div>

            <button
                class="btn btn-primary login-btn"
                type="submit">

                Đổi mật khẩu

            </button>

        </form>

        <div class="login-footer">

            <a href="{{ url_for('dashboard.home') }}">

                Quay lại Dashboard

            </a>

        </div>

    </div>

</div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>

</html>
