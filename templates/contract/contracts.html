<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hợp Đồng</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS System & Dark Mode -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/list.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark_light_mode.css') }}">
</head>

<body>

    <div class="app-wrapper">
    

        <!-- Main Content -->
        <main class="app-main">
            <div class="app-content">
                <div class="container">

                    <!-- Header -->
                    <div class="page-header">
                        <div>
                            <h1>Quản Lý Hợp Đồng</h1>
                        </div>
                    </div>

                    <!-- Flash Messages -->
                    {% include "contract/components/_flash.html" %}

                    <!-- 1. Ô Tìm Kiếm -->
                    <div class="mb-2">
                        {% include "contract/components/_search.html" %}
                    </div>

                    <!-- 2. Nút Thao Tác (+ Thêm, Xóa, Xuất CSV) -->
                    <div class="card mb-2">
                        {% include "contract/components/_actions.html" %}
                    </div>

                    <!-- 3. Bảng Dữ Liệu -->
                    <div class="card">
                        {% include "contract/components/_table.html" %}
                    </div>

                    <!-- 4. Phân Trang -->
                    {% include "contract/components/_pagination.html" %}

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/contract_bulk_delete.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>

</body>

</html>s
