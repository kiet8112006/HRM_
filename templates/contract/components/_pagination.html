<div class="pagination">

    {% if page > 1 %}

        <a
            href="{{ url_for('contract.list_contracts', page=page-1, keyword=keyword, status=status) }}">

            ← Trước

        </a>

    {% endif %}

    <span>

        Trang {{ page }} / {{ total_pages }}

    </span>

    {% if page < total_pages %}

        <a
            href="{{ url_for('contract.list_contracts', page=page+1, keyword=keyword, status=status) }}">

            Sau →

        </a>

    {% endif %}

</div>
