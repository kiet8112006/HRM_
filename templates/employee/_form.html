<form method="POST" class="form-card" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-grid">
        <div class="form-group full">

    <label class="form-label">
        Ảnh nhân viên
    </label>

    <div class="avatar-upload">

        <img
            id="preview-image"
            src="{{ url_for('static', filename='avatars/default.png') }}"
            class="preview-avatar">

        <input
            id="photo"
            type="file"
            name="photo"
            accept=".jpg,.jpeg,.png,.webp"
            class="form-control">

    </div>
    <div class="form-group full">

    <label class="form-label">
        CCCD mặt trước
    </label>

    <input
        type="file"
        name="citizen_front"
        class="form-control"
        accept=".jpg,.jpeg,.png,.webp">

</div>
<div class="form-group full">

    <label class="form-label">
        CCCD mặt sau
    </label>

    <input
        type="file"
        name="citizen_back"
        class="form-control"
        accept=".jpg,.jpeg,.png,.webp">

</div>

</div>


        <!-- Họ tên -->
        <div class="form-group">
            <label class="form-label">Họ Và Tên</label>
            <input
                class="form-control"
                type="text"
                name="fullname"
                maxlength="100"
                placeholder="Ví dụ: Nguyễn Văn A"
                autocomplete="off"
                required>
        </div>

        <!-- Giới tính -->
        <div class="form-group">
            <label class="form-label">Giới Tính</label>

            <select
                class="form-control"
                name="gender">

                <option value="Nam" selected>
                    Nam
                </option>

                <option value="Nữ">
                    Nữ
                </option>

            </select>
        </div>

        <!-- Ngày sinh -->
        <div class="form-group">
            <label class="form-label">Ngày Sinh</label>

            <input
                class="form-control"
                type="date"
                name="dob"
                required>
        </div>

        <!-- Ngày tuyển dụng -->
        <div class="form-group">
            <label class="form-label">Ngày Tuyển Dụng</label>

            <input
                class="form-control"
                type="date"
                name="hiredate"
                required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label class="form-label">Email</label>

            <input
                class="form-control"
                type="email"
                name="email"
                maxlength="100"
                placeholder="example@gmail.com"
                required>
        </div>

        <!-- Điện thoại -->
        <div class="form-group">
            <label class="form-label">Số Điện Thoại</label>

            <input
                class="form-control"
                type="text"
                name="phone"
                maxlength="10"
                placeholder="0xxxxxxxxx"
                required>
        </div>

        <!-- CCCD -->
        <div class="form-group">
            <label class="form-label">CCCD</label>

            <input
                class="form-control"
                type="text"
                name="citizenid"
                maxlength="12"
                placeholder="012345678901"
                required>
        </div>

        <!-- Quốc tịch -->
        <div class="form-group">
            <label class="form-label">Quốc Tịch</label>

            <input
                class="form-control"
                type="text"
                name="nationality"
                maxlength="50"
                placeholder="Việt Nam"
                required>
        </div>

        <!-- Phòng ban -->
        <div class="form-group">
            <label class="form-label">Phòng Ban</label>

            <select
                class="form-control"
                name="department_id">

                {% for dept in departments %}

                <option value="{{ dept.DepartmentID }}">
                    {{ dept.DepartmentName }}
                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Chức vụ -->
        <div class="form-group">
            <label class="form-label">Chức Vụ</label>

            <select
                class="form-control"
                name="position_id">

                {% for pos in positions %}

                <option value="{{ pos.PositionID }}">
                    {{ pos.PositionName }}
                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Quản lý -->
        <div class="form-group">
            <label class="form-label">Quản Lý</label>

            <select
                class="form-control"
                name="manager_id">

                <option value="">
                    -- Không có --
                </option>

                {% for manager in managers %}

                <option value="{{ manager.EmployeeID }}">
                    {{ manager.FullName }}
                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Trạng thái -->
        <div class="form-group">
            <label class="form-label">Trạng Thái</label>

            <select
                class="form-control"
                name="status">

                <option value="Active" selected>
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

            </select>
        </div>

        <!-- Địa chỉ -->
        <div class="form-group full">
            <label class="form-label">Địa Chỉ</label>

            <textarea
                class="form-control"
                name="address"
                rows="3"
                maxlength="255"
                placeholder="Nhập địa chỉ"
                required></textarea>
        </div>

        <!-- Tình trạng hôn nhân -->
        <div class="form-group">
            <label class="form-label">Tình Trạng Hôn Nhân</label>

            <select
                class="form-control"
                name="maritalstatus">

                <option value="Độc thân" selected>
                    Độc thân
                </option>

                <option value="Đã kết hôn">
                    Đã kết hôn
                </option>

            </select>
        </div>

        <!-- Người liên hệ -->
        <div class="form-group">
            <label class="form-label">
                Người Liên Hệ Khẩn Cấp
            </label>

            <input
                class="form-control"
                type="text"
                name="emergencycontact"
                maxlength="100"
                placeholder="Nguyễn Văn B"
                required>
        </div>

        <!-- SĐT khẩn cấp -->
        <div class="form-group">
            <label class="form-label">
                SĐT Khẩn Cấp
            </label>

            <input
                class="form-control"
                type="text"
                name="emergencyphone"
                maxlength="10"
                placeholder="0xxxxxxxxx"
                required>
        </div>

    </div>

    <div class="form-actions">

        <button
            type="submit"
            class="btn btn-primary">

            ➕ Thêm Nhân Viên

        </button>

        <a
            href="{{ url_for('employee.employees') }}"
            class="btn btn-secondary">

            ← Quay lại

        </a>

    </div>

</form>
